[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nc-gcode-interpreter"
dynamic = ["version"]
description = "A interpreter for NC (Numerical Control) GCode"
authors = [{ name = "CEAD Group", email = "software@ceadgroup.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "maturin>=1.7.4",
    # >= 1.9 covers the Arrow PyCapsule interface (>= 1.3) the interpreter uses
    # to receive record batches from Rust; no pyarrow extra needed.
    "polars>=1.9.0"
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.1"
]
viz = [
    "threejs-viewer>=0.0.41",
    "numpy>=1.26",
]
test = [
    "pytest>=8.3.3",
    "mypy"
]

[tool.maturin]
features = ["pyo3/extension-module", "python"]
module-name = "nc_gcode_interpreter._internal"
python-source = "python"
include = ["python/nc_gcode_interpreter/py.typed", "python/nc_gcode_interpreter/ggroups.json"]

[project.scripts]
nc-view = "nc_gcode_interpreter.cli:main"

[project.urls]
Homepage = "https://github.com/CEAD-group/nc-gcode-interpreter"
Repository = "https://github.com/CEAD-group/nc-gcode-interpreter.git"
Documentation = "https://github.com/CEAD-group/nc-gcode-interpreter/blob/main/README.md"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pin the rule set explicitly. `ruff check .` previously ran on ruff's implicit
# defaults, so when ruff 0.16 widened them the lint job went red on 64
# pre-existing findings in code nobody had touched. An explicit select means a
# ruff upgrade adds rules only when we ask for them.
select = [
    "E4", "E7", "E9", "F", # ruff's historical defaults
    "I",                   # import sorting
    "UP",                  # pyupgrade
    "B",                   # bugbear
    "C4",                  # comprehensions
    "PIE",
    "RUF",
]
ignore = [
    # Collapsing a joined list of NC lines into one f-string literal makes the
    # test programs unreadable - the point of the list is one NC block per line.
    "FLY002",
]

[tool.mypy]
# The viz extra's dependencies are optional: mypy runs in CI without them.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "threejs_viewer", "threejs_viewer.*"]
ignore_missing_imports = true
